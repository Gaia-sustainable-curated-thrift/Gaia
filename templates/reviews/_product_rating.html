<a class="pdp-rating" href="{% url 'reviews:seller_reviews' seller.pk %}" aria-label="Read {{ total_reviews }} seller reviews">
    {% if total_reviews %}
        <span class="pdp-rating-value">{{ average_rating|floatformat:1 }}</span>
        <span aria-hidden="true">&#9733;</span>
        <span class="pdp-rating-count">({{ total_reviews }}) &middot; Read reviews</span>
    {% else %}
        <span class="pdp-rating-count">No reviews yet &middot; View seller reviews</span>
    {% endif %}
</a>
