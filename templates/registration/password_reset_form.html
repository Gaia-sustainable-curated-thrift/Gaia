{% extends 'registration/base.html' %}
{% block title %}Forgot Password
{% endblock %}
{% block auth_content %}
<h1>Forgot password?
</h1>
<p class="muted">Enter your account email. We'll send a link to reset your password.
</p>
<form method="post">{% csrf_token %}{% include 'includes/fields.html' %}<button class="button full-width" type="submit">Send Reset Link</button>
</form><a class="auth-back" href="{% url 'login' %}">Back to Log In</a>
{% endblock %}
