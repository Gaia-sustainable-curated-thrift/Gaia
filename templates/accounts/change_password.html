{% extends 'accounts/layout.html' %}
{% block account_content %}
<section class="card">
<h2>New Password
</h2>
<form method="post">{% csrf_token %}{% include 'includes/fields.html' %}
<p class="small muted">Use at least 8 characters. Avoid common passwords and personal information.
</p>
<div class="actions"><button class="button" type="submit">Save Password</button><a class="text-button" href="{% url 'account_settings' %}">Cancel</a>
</div>
</form>
</section>
{% endblock %}
