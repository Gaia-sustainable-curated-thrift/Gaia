{% extends 'accounts/base.html' %}
{% load static %}
{% block extra_css %}
<script src="{% static 'js/vendor/htmx.min.js' %}" defer></script>
{# Product page features, one file each; they register with Gaia from gaia.js. #}
<script src="{% static 'js/products/tabs.js' %}" defer></script>
<script src="{% static 'js/products/search.js' %}" defer></script>
<script src="{% static 'js/products/gallery.js' %}" defer></script>
<script src="{% static 'js/products/wishlist.js' %}" defer></script>
<script src="{% static 'js/products/listing-form.js' %}" defer></script>
<script src="{% static 'js/products/listing-delete.js' %}" defer></script>
<script src="{% static 'js/products/home.js' %}" defer></script>
<script src="{% static 'js/products/page-transitions.js' %}" defer></script>
{# Product pages opt in to cross-page view transitions, so a card photo can morph into the detail photo. #}
<style>
@view-transition { navigation: auto; }
::view-transition-group(*) { animation-duration: 380ms; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
@media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
}
</style>
{% endblock %}
