{% if page_obj.has_other_pages %}<nav class="account-pagination" aria-label="{{ pagination_label }} pagination">
{% if page_obj.has_previous %}<a class="button" href="?{% if order_scope %}scope={{ order_scope }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">&larr; Previous</a>{% endif %}
<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a class="button" href="?{% if order_scope %}scope={{ order_scope }}&amp;{% endif %}page={{ page_obj.next_page_number }}" rel="next">Next &rarr;</a>{% endif %}
</nav>{% endif %}
