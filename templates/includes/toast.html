{% if bag_toast and bag_toast.kind == 'added' %}
<div class="toast toast--added" role="status" data-toast data-toast-duration="4000">
    <span class="toast__text">{{ bag_toast.text }}</span>
    {% if bag_toast.icon %}<span class="toast__icon">{% include 'includes/icon.html' with name='bag' %}</span>{% endif %}
</div>
{% endif %}
